services:
  - type: web
    name: plfog
    runtime: python
    buildCommand: |
      pip install -r requirements.txt &&
      python manage.py collectstatic --noinput &&
      python manage.py migrate --run-syncdb &&
      python manage.py seed_notification_templates --quiet &&
      python manage.py seed_help_center &&
      python manage.py seed_example_guild
    startCommand: gunicorn plfog.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.0"
      # Where the Knowledge Base lives — an override, NOT what makes the sidebar entry appear.
      # This file only reaches a service whose blueprint is applied, and on 2026-09-19 this entry
      # did not: the code deployed, the variable never arrived, and the sidebar entry was missing
      # in production with nothing in the logs to say so. The address now ships in the repository
      # as DEFAULT_KNOWLEDGE_BASE_URL in plfog/settings.py, so deploying the code deploys the
      # link. Kept here because a value set here still wins, and because it documents the address.
      #
      # TODO: change to https://kb.pastlives.space once that A record exists — in settings.py
      # first, which is the one that takes effect. The KB answers on both; the sslip.io hostname
      # is the one that resolves today and it carries a valid cert.
      - key: KNOWLEDGE_BASE_URL
        value: "https://179.237.83.7.sslip.io"
      # The OIDC signing key is deliberately NOT here: this repository is public, and a private
      # key in it would be a private key on the internet. It is set in the Render dashboard, and
      # until it is, the OIDC endpoints issue nothing (see OAUTH2_PROVIDER in plfog/settings.py).
      - key: OIDC_RSA_PRIVATE_KEY
        sync: false
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        sync: false
        previewValue: "False"
      - key: DJANGO_ALLOWED_HOSTS
        sync: false
        previewValue: ".onrender.com"
      # Declared next to DJANGO_ALLOWED_HOSTS on purpose: core.E002 stops a deploy whose
      # PUBLIC_HOSTS entry is not in ALLOWED_HOSTS, and the settings default is the
      # production host. A preview serves no public host, so it gets an empty list.
      - key: PUBLIC_HOSTS
        sync: false
        previewValue: ""
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
        previewValue: "https://*.onrender.com"
      - key: EMAIL_BACKEND
        sync: false
        previewValue: "django.core.mail.backends.console.EmailBackend"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: WEBPUSH_VAPID_PUBLIC_KEY
        sync: false
        previewValue: "preview-placeholder"
      - key: WEBPUSH_VAPID_PRIVATE_KEY
        sync: false
        previewValue: "preview-placeholder"
      - key: WEBPUSH_VAPID_ADMIN_EMAIL
        sync: false
        previewValue: "preview@example.com"
      - key: SENTRY_DSN
        sync: false
      # Mailchimp newsletter/marketing subscribes. Blank disables the integration.
      # Site Settings values (if an admin has entered any) take precedence over these.
      - key: MAILCHIMP_API_KEY
        sync: false
      - key: MAILCHIMP_LIST_ID
        sync: false

    # Preview environments for pull requests
    previews:
      generation: automatic

  # Nightly Airtable → Django sync (pulls AT changes into the database)
  # Requires env vars: DATABASE_URL, DJANGO_SECRET_KEY, AIRTABLE_API_TOKEN,
  # AIRTABLE_BASE_ID, AIRTABLE_SYNC_ENABLED=true (set in Render dashboard)
  - type: cron
    name: airtable-pull
    runtime: python
    schedule: "0 10 * * *"
    buildCommand: pip install -r requirements.txt
    command: python manage.py airtable_pull
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.0"

  # Single dispatcher for all scheduled background tasks.
  # Runs every 15 minutes. Each task is responsible for its own idempotency.
  # sync_all_sources is time-gated inside the command (runs at 13:xx UTC ≈ 6 AM Portland).
  # Add new scheduled tasks in core/management/commands/run_scheduled_tasks.py only —
  # no Render config changes needed.
  - type: cron
    name: run-scheduled-tasks
    runtime: python
    schedule: "*/15 * * * *"
    buildCommand: pip install -r requirements.txt
    command: python manage.py run_scheduled_tasks
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.0"
