services:
  - type: web
    name: plfog
    runtime: python
    buildCommand: |
      pip install -r requirements.txt &&
      python manage.py collectstatic --noinput &&
      python manage.py migrate --run-syncdb
    startCommand: gunicorn plfog.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.0"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        sync: false
        previewValue: "False"
      - key: DJANGO_ALLOWED_HOSTS
        sync: false
        previewValue: ".onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
        previewValue: "https://*.onrender.com"
      - key: EMAIL_BACKEND
        sync: false
        previewValue: "django.core.mail.backends.console.EmailBackend"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: WEBPUSH_VAPID_PUBLIC_KEY
        sync: false
        previewValue: "preview-placeholder"
      - key: WEBPUSH_VAPID_PRIVATE_KEY
        sync: false
        previewValue: "preview-placeholder"
      - key: WEBPUSH_VAPID_ADMIN_EMAIL
        sync: false
        previewValue: "preview@example.com"
      - key: SENTRY_DSN
        sync: false

    # Preview environments for pull requests
    previews:
      generation: automatic

  # Nightly Airtable → Django sync (pulls AT changes into the database)
  # Requires env vars: DATABASE_URL, DJANGO_SECRET_KEY, AIRTABLE_API_TOKEN,
  # AIRTABLE_BASE_ID, AIRTABLE_SYNC_ENABLED=true (set in Render dashboard)
  - type: cron
    name: airtable-pull
    runtime: python
    schedule: "0 10 * * *"
    buildCommand: pip install -r requirements.txt
    command: python manage.py airtable_pull
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.0"

  # Daily morning sync of every calendar feed + the legacy CMS into the database.
  # The Community Calendar and book/CMS pages read these rows straight from the DB,
  # so this is the single scheduled refresh for the whole site (replaces the old
  # page-load trigger). Toggles in Site Settings still gate the classes/legacy sources.
  # Requires the same env vars as the web service (DATABASE_URL, DJANGO_SECRET_KEY,
  # EMAIL_*, WEBPUSH_*, SENTRY_DSN) — set them on this cron in the Render dashboard.
  - type: cron
    name: daily-sync
    runtime: python
    schedule: "0 13 * * *"  # 13:00 UTC ≈ 6 AM Portland
    buildCommand: pip install -r requirements.txt
    command: python manage.py sync_all_sources
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.0"
