name: E2E (Playwright)

on:
  push:
    branches: [main, 'release-**']
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, closed]

# One run per pull request: a new push cancels that PR's older run, and closing or merging the
# PR cancels whatever is still going (the `closed` event joins the group, then its jobs skip).
# Pushes to main and release branches group by branch, so a burst of merges tests only the
# newest commit instead of holding a runner per merge.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DJANGO_SECRET_KEY: test-secret-key-for-ci
      DATABASE_URL: postgres://plfog:plfog@localhost:5432/plfog
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # `playwright install --with-deps` runs apt-get update across every source on the
      # runner image, and mirrors flake: Google's Chrome index in particular has served a
      # bad hash for hours at a time. Playwright ships its own Chromium, so that source is
      # never needed; drop it, then give the install three attempts with a pause between.
      - name: Drop the preinstalled Google Chrome apt source
        # This reports which files it removed, and it matches on content rather than on a
        # filename glob. The earlier form removed google-chrome*.list and matched nothing:
        # the runner image ships a deb822 /etc/apt/sources.list.d/google-chrome.sources,
        # so the source stayed configured and the step passed silently either way. A CI run
        # on this branch confirmed the .sources path is the one that actually exists.
        run: |
          found=$(grep -rl 'dl\.google\.com' /etc/apt/sources.list.d/ 2>/dev/null || true)
          if [ -n "$found" ]; then
            echo "Removing Google Chrome apt source(s):"
            echo "$found"
            echo "$found" | xargs -r sudo rm -f
          else
            echo "No Google Chrome apt source present; nothing to remove."
          fi

      # Postgres comes from the PostgreSQL project's own apt repository (apt.postgresql.org),
      # the same packages production's 18.x is built from, instead of a container image.
      # Container registries meter anonymous pulls: Docker Hub refused postgres:18 (#743), then
      # the AWS public mirror did the same on 2026-10-15, and either one fails the job before a
      # test runs. Three attempts with a pause, like the Playwright install below.
      - name: Install and start Postgres 18
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          for attempt in 1 2 3; do
            if sudo apt-get update -q && sudo apt-get install -yq --no-install-recommends postgresql-18; then
              break
            fi
            if [ "$attempt" = 3 ]; then echo "Postgres install failed three times"; exit 1; fi
            echo "Postgres install failed on attempt $attempt; retrying in 20s"
            sleep 20
          done
          # The runner image ships an older Postgres whose cluster claims 5432 in its config;
          # give 18 its own cluster on 5432 so DATABASE_URL stays as it was.
          sudo pg_dropcluster --stop 18 main 2>/dev/null || true
          sudo pg_createcluster 18 main --port 5432 --start
          sudo -u postgres psql -v ON_ERROR_STOP=1 -c "CREATE ROLE plfog LOGIN SUPERUSER PASSWORD 'plfog';" -c "CREATE DATABASE plfog OWNER plfog;"
          pg_isready -h localhost -p 5432 -U plfog
          psql "$DATABASE_URL" -tAc "show server_version"

      - name: Install Playwright browser
        run: |
          for attempt in 1 2 3; do
            if python -m playwright install --with-deps chromium; then
              exit 0
            fi
            echo "playwright install failed on attempt $attempt; retrying in 20s"
            sleep 20
          done
          echo "playwright install failed three times"
          exit 1

      - name: Run end-to-end tests
        run: pytest -m e2e --no-cov --tb=short
