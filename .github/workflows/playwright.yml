name: E2E (Playwright)

on:
  push:
    branches: [main, 'release-**']
  pull_request:
    branches: [main]

jobs:
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: plfog
          POSTGRES_USER: plfog
          POSTGRES_PASSWORD: plfog
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U plfog"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SECRET_KEY: test-secret-key-for-ci
      DATABASE_URL: postgres://plfog:plfog@localhost:5432/plfog
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # `playwright install --with-deps` runs apt-get update across every source on the
      # runner image, and mirrors flake: Google's Chrome index in particular has served a
      # bad hash for hours at a time. Playwright ships its own Chromium, so that source is
      # never needed; drop it, then give the install three attempts with a pause between.
      - name: Drop the preinstalled Google Chrome apt source
        # This reports which files it removed, and it matches on content rather than on a
        # filename glob. The earlier form removed google-chrome*.list and matched nothing:
        # the runner image ships a deb822 /etc/apt/sources.list.d/google-chrome.sources,
        # so the source stayed configured and the step passed silently either way. A CI run
        # on this branch confirmed the .sources path is the one that actually exists.
        run: |
          found=$(grep -rl 'dl\.google\.com' /etc/apt/sources.list.d/ 2>/dev/null || true)
          if [ -n "$found" ]; then
            echo "Removing Google Chrome apt source(s):"
            echo "$found"
            echo "$found" | xargs -r sudo rm -f
          else
            echo "No Google Chrome apt source present; nothing to remove."
          fi

      - name: Install Playwright browser
        run: |
          for attempt in 1 2 3; do
            if python -m playwright install --with-deps chromium; then
              exit 0
            fi
            echo "playwright install failed on attempt $attempt; retrying in 20s"
            sleep 20
          done
          echo "playwright install failed three times"
          exit 1

      - name: Run end-to-end tests
        run: pytest -m e2e --no-cov --tb=short
