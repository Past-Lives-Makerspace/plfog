name: E2E (Playwright)

on:
  push:
    branches: [main, 'release-**']
  pull_request:
    branches: [main]

jobs:
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: plfog
          POSTGRES_USER: plfog
          POSTGRES_PASSWORD: plfog
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U plfog"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SECRET_KEY: test-secret-key-for-ci
      DATABASE_URL: postgres://plfog:plfog@localhost:5432/plfog
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Drop the preinstalled Google Chrome apt source
        # The runner image ships Google's chrome-stable repo, which we never install from
        # (Playwright brings its own chromium). Its metadata has taken this job red twice
        # on an apt hash sum mismatch, so the source comes out before --with-deps runs apt.
        # It says which files it removed: a silent version that quietly matched nothing
        # would look identical to a working fix right up until the flake came back.
        run: |
          found=$(grep -rl 'dl\.google\.com' /etc/apt/sources.list.d/ 2>/dev/null || true)
          if [ -n "$found" ]; then
            echo "Removing Google Chrome apt source(s):"
            echo "$found"
            echo "$found" | xargs -r sudo rm -f
          else
            echo "No Google Chrome apt source present; nothing to remove."
          fi

      - name: Install Playwright browser
        run: python -m playwright install --with-deps chromium

      - name: Run end-to-end tests
        run: pytest -m e2e --no-cov --tb=short
