name: Nightly

# The full suite on main, which pull requests no longer run (#1192): the same eight shards as the
# `affected` check (specs.yml) given every spec, the coverage combined under the 98% gate in
# pyproject.toml, and the result reported on one issue labelled nightly-red. A red night opens
# it, or comments on it while it is open; a green night closes it. GitHub notifies watchers of
# the new issue; a person or a session fixes it from there.
#
# 10:00 UTC is 2 AM Pacific in winter and 3 AM in summer, after the day's merges. Run it by hand
# with `gh workflow run nightly.yml`.

on:
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  specs:
    uses: ./.github/workflows/specs.yml
    with:
      paths: "."

  coverage:
    needs: specs
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      total: ${{ steps.total.outputs.total }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install coverage
        run: pip install "coverage>=7.6"

      - uses: actions/download-artifact@v4
        with:
          pattern: specs-*
          merge-multiple: true

      - name: Combine the shards' coverage
        id: total
        run: |
          coverage combine
          echo "total=$(coverage report --format=total --precision=2)" >> "$GITHUB_OUTPUT"

      - name: Total coverage is at least 98%
        run: coverage report --skip-covered

  report:
    needs: [specs, coverage]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      LABEL: nightly-red
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      SPECS_RESULT: ${{ needs.specs.result }}
      COVERAGE_RESULT: ${{ needs.coverage.result }}
      COVERAGE_TOTAL: ${{ needs.coverage.outputs.total }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - uses: actions/download-artifact@v4
        with:
          pattern: specs-*
          merge-multiple: true
          path: reports

      - name: Open, update or close the nightly-red issue
        run: |
          gh label create "$LABEL" --force --color B60205 \
            --description "The nightly full suite on main is red (nightly.yml)"
          open=$(gh issue list --label "$LABEL" --state open --limit 1 --json number --jq '.[0].number // empty')
          if [ "$SPECS_RESULT" = success ] && [ "$COVERAGE_RESULT" = success ]; then
            if [ -n "$open" ]; then
              gh issue close "$open" --comment "The nightly full suite is green again: $RUN_URL"
            fi
            exit 0
          fi
          python .github/scripts/nightly_report.py reports > body.md
          if [ -n "$open" ]; then
            gh issue comment "$open" --body-file body.md
          else
            gh issue create --title "Nightly full suite is red" --label "$LABEL" --body-file body.md
          fi
