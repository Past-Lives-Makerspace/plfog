name: Discord Notifications

# Fires automatically when a push to main ships a new VERSION, and can still be run by
# hand (`gh workflow run discord-notify.yml`, or the Actions "Run workflow" button).
#
# This was manual-only for a while because it used to re-post the WHOLE current
# release-line changelog on every routine hotfix merge, spamming members with things
# already announced. The script now posts ONLY the entry/entries stamped at the current
# VERSION, so one merge means one deploy means one announcement. Two guards keep it that
# way on automatic runs:
#   1. `paths:` — the job is only considered when plfog/version.py itself changed.
#   2. the "Check whether VERSION changed" step below — it compares VERSION against the
#      tip of main before the push.
# That second guard used to SKIP the post and exit zero when VERSION had not moved, which is
# how #348 shipped the lobby slideshow to production and announced it to nobody on a green
# Actions tab. It now FAILS the run instead. The guarantee it used to give — "edits to
# changelog wording, or any other version.py churn, never re-announce a shipped release" —
# still holds, but it is now paid for with a red X rather than a quiet skip: a push to main
# that touches version.py without moving VERSION is a build failure, changelog-wording-only
# edits included. Fix it forward in a PR that bumps VERSION.
# A red X here is the whole alert: it notifies nothing outside GitHub, by choice.
# `.github/scripts/release_guard.py` explains the predicate and what it was measured against,
# and CLAUDE.md under "The release guard" has the recovery.
# A manual run always posts, which is the escape hatch for re-sending an announcement.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "plfog/version.py"

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Full history, so the step below can read VERSION at `github.event.before` — the
          # tip of main before the push. A shallow clone only reaches HEAD^, and a rebase
          # merge pushes every commit of the PR at once, so HEAD^ is then a commit from
          # inside the PR that may already carry the bump.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Check whether VERSION changed
        id: version_changed
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        # Sets should_post=true, or exits non-zero when this push shipped a release that
        # would announce nothing. It never sets should_post=false: a push that would have
        # been skipped is now a failure, and a manual run always posts.
        run: python .github/scripts/release_guard.py

      - name: Post release announcement to Discord
        if: steps.version_changed.outputs.should_post == 'true'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          # Manual runs keep the escape hatch of re-sending the newest entry when the
          # current VERSION has none of its own. Automatic pushes must not: a VERSION with
          # no entry shipped nothing member-facing, and re-posting would duplicate a
          # release members already saw.
          FORCE_ANNOUNCE: ${{ github.event_name == 'workflow_dispatch' }}
        # Posts only the current VERSION's changelog entry (what just shipped),
        # chunked under Discord's 4096-char embed limit, failing loudly on rejection.
        run: python .github/scripts/discord_release_notify.py
