name: Delivery board

# Moves a ticket's card across the delivery board as the work becomes visible to GitHub.
# The board's columns are Backlog, Triage / Not Started, In Progress, In Draft (Awaiting
# Mock/Screenshot Approval), In Bot Review, Ready to Merge, Done. Everything below, and the
# CLI, speaks a single word per column (Triage, Progress, Draft, Review, Ready, Done);
# project_status.py holds the one mapping between the two. This workflow owns Progress
# onward. Triage is the board's own built-in auto-add workflow, configured in the board UI
# rather than here, and Backlog is a column people park cards in by hand.
#
# Movement is forward only. A push to a branch that already has an open pull request does
# not drag the card back from In Bot Review to In Progress; see the script's module
# docstring. The one deliberate backwards move is a pull request converted back to draft,
# which passes --force.
#
# The credential is PROJECT_PAT: a classic token holding ONLY the `project` scope. It is
# deliberately not BOT_PAT, which holds `repo` and is already handed to the
# pull_request_target job in bot-review.yml. A token that can only move cards can only ever
# move cards, so the worst this workflow can do when something goes wrong is put a card in
# the wrong column. GITHUB_TOKEN cannot be used at all: it is scoped to the repository that
# issued it, and an organization board belongs to no repository.
#
#
# Every step below is `continue-on-error`. The board is a window onto the work and never a
# gate on it, so a board that cannot be reached must not redden an unrelated pull request.
# That is not squeamishness about red: it is protecting the meaning of red. A red X in this
# repo already means "a release shipped to production and announced to nobody" (#364), and
# that signal is worth keeping rare. A workflow that fires on every push to every branch and
# goes red whenever a token expires would train everyone to scroll past exactly the X that
# matters. The failure is still visible as an annotation on the run, and the board visibly
# stops moving, which is the louder signal in practice.
#
# The trigger is `pull_request`, not `pull_request_target`. That means a pull request from a
# fork gets no secrets and moves no card, which is the behaviour we want: a drive-by fork PR
# has no ticket on this board. The same holds for `pull_request_review`.

on:
  push:
    branches-ignore:
      - main
  pull_request:
    types: [opened, reopened, ready_for_review, converted_to_draft, closed]
  pull_request_review:
    types: [submitted]
  issues:
    types: [closed]
  workflow_dispatch:
    inputs:
      issue:
        description: Issue number to move
        required: true
        type: string
      status:
        description: Target column
        required: true
        type: choice
        options: [Triage, Progress, Draft, Review, Ready, Done]
      force:
        description: Allow a backwards move
        required: false
        type: boolean
        default: false

# Keyed by branch, so a push and the pull request opened from that branch queue behind each
# other instead of both reading the card before either writes it. That is the common race.
# What this does NOT cover: an issue closing (keyed by its number) against the merge that
# closed it, and a third event on a busy branch, which GitHub resolves by cancelling the run
# still pending in the group. Both leave the card one column short, never past where it should be,
# and the next event or a hand move corrects it.
concurrency:
  group: delivery-board-${{ github.event.issue.number || github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  move:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the scripts
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # A branch appearing is the first thing GitHub can see of the work. Every later push
      # to the same branch re-runs this and is a no-op, because the card is by then at
      # Draft or beyond and the move is forward only.
      - name: Progress -- a branch exists
        continue-on-error: true
        if: github.event_name == 'push'
        env:
          PROJECT_PAT: ${{ secrets.PROJECT_PAT }}
          PROJECT_OWNER: ${{ github.repository_owner }}
          PROJECT_NUMBER: ${{ vars.PROJECT_NUMBER }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python .github/scripts/project_status.py --branch "${GITHUB_REF#refs/heads/}" --status Progress

      # Opened as a draft, or converted back to one. Converting is a person deliberately
      # taking a PR out of review (a mock or screenshot still needs approval), so it passes
      # --force and moves the card back from In Bot Review or Ready to Merge.
      - name: Draft -- a draft pull request is open
        continue-on-error: true
        if: >-
          github.event_name == 'pull_request' &&
          ((github.event.action == 'opened' && github.event.pull_request.draft) ||
           github.event.action == 'converted_to_draft')
        env:
          PROJECT_PAT: ${{ secrets.PROJECT_PAT }}
          PROJECT_OWNER: ${{ github.repository_owner }}
          PROJECT_NUMBER: ${{ vars.PROJECT_NUMBER }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          FORCE: ${{ github.event.action == 'converted_to_draft' && '--force' || '' }}
        run: python .github/scripts/project_status.py --pr ${{ github.event.pull_request.number }} --status Draft $FORCE

      # Opened ready, reopened, or marked ready: this is what fires PastLivesReviewBot.
      - name: Review -- a pull request is open for review
        continue-on-error: true
        if: >-
          github.event_name == 'pull_request' &&
          ((github.event.action == 'opened' && !github.event.pull_request.draft) ||
           github.event.action == 'reopened' || github.event.action == 'ready_for_review')
        env:
          PROJECT_PAT: ${{ secrets.PROJECT_PAT }}
          PROJECT_OWNER: ${{ github.repository_owner }}
          PROJECT_NUMBER: ${{ vars.PROJECT_NUMBER }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python .github/scripts/project_status.py --pr ${{ github.event.pull_request.number }} --status Review

      # Only the review bot's approval counts. PastLivesReviewBot is a plain user account
      # (bot_review_post.py posts with BOT_PAT), so its login carries no "[bot]" suffix. The
      # webhook spells the state in lower case.
      - name: Ready -- the review bot approved
        continue-on-error: true
        if: >-
          github.event_name == 'pull_request_review' &&
          github.event.review.state == 'approved' &&
          github.event.review.user.login == 'PastLivesReviewBot'
        env:
          PROJECT_PAT: ${{ secrets.PROJECT_PAT }}
          PROJECT_OWNER: ${{ github.repository_owner }}
          PROJECT_NUMBER: ${{ vars.PROJECT_NUMBER }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python .github/scripts/project_status.py --pr ${{ github.event.pull_request.number }} --status Ready

      # Merged, not closed. A pull request closed without merging leaves the card where it
      # is: the ticket did not advance, and dropping it to Done would be a lie.
      - name: Done -- merged
        continue-on-error: true
        if: github.event_name == 'pull_request' && github.event.pull_request.merged == true
        env:
          PROJECT_PAT: ${{ secrets.PROJECT_PAT }}
          PROJECT_OWNER: ${{ github.repository_owner }}
          PROJECT_NUMBER: ${{ vars.PROJECT_NUMBER }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python .github/scripts/project_status.py --pr ${{ github.event.pull_request.number }} --status Done

      - name: Done -- the issue closed
        continue-on-error: true
        if: github.event_name == 'issues'
        env:
          PROJECT_PAT: ${{ secrets.PROJECT_PAT }}
          PROJECT_OWNER: ${{ github.repository_owner }}
          PROJECT_NUMBER: ${{ vars.PROJECT_NUMBER }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python .github/scripts/project_status.py --issue ${{ github.event.issue.number }} --status Done

      # NOT continue-on-error, unlike the ambient steps above. Somebody typed a ticket
      # number into a form and pressed the button; a green run that moved nothing would
      # be lying to the one person actually watching this workflow.
      - name: Move by hand
        if: github.event_name == 'workflow_dispatch'
        env:
          PROJECT_PAT: ${{ secrets.PROJECT_PAT }}
          PROJECT_OWNER: ${{ github.repository_owner }}
          PROJECT_NUMBER: ${{ vars.PROJECT_NUMBER }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          # Through the environment, never interpolated into the script: `issue` is free text.
          INPUT_ISSUE: ${{ inputs.issue }}
          INPUT_STATUS: ${{ inputs.status }}
          INPUT_FORCE: ${{ inputs.force }}
        run: |
          force=()
          if [ "$INPUT_FORCE" = "true" ]; then force=(--force); fi
          python .github/scripts/project_status.py --issue "$INPUT_ISSUE" --status "$INPUT_STATUS" "${force[@]}"
