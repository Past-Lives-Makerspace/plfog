name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, closed]
  # The merge queue runs lint and the affected specs here; e2e runs in playwright.yml.
  merge_group:

# One run per pull request: a new push cancels that PR's older run, and closing or merging the
# PR cancels whatever is still going (the `closed` event joins the group, then its jobs skip).
# Pushes to main share one group too, so a burst of merges lints only the newest commit; the
# full suite runs on main nightly (nightly.yml).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # A pull request runs the specs its diff can break (.github/scripts/affected_specs.py), split
  # across seven runners (specs.yml), and `affected` gates on them and on the changed lines' branch
  # coverage. `affected` is the required check, so it runs in the merge queue too. The full suite
  # runs nightly on main instead (nightly.yml), and a red night opens an issue (#1192).
  select:
    if: github.event.action != 'closed' && github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      paths: ${{ steps.select.outputs.paths }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Pick the specs this diff can break
        id: select
        env:
          BASE: ${{ github.event.merge_group.base_sha || github.event.pull_request.base.sha }}
        run: |
          paths=$(python .github/scripts/affected_specs.py "$BASE")
          echo "${paths:-No spec applies to this diff.}"
          { echo "paths<<EOF"; echo "$paths"; echo "EOF"; } >> "$GITHUB_OUTPUT"

  specs:
    needs: select
    if: needs.select.outputs.paths != ''
    uses: ./.github/workflows/specs.yml
    with:
      paths: ${{ needs.select.outputs.paths }}

  affected:
    needs: [select, specs]
    # Runs whatever the shards did, so a failed shard fails this check rather than skipping it:
    # GitHub counts a skipped required check as passed.
    if: github.event.action != 'closed' && github.event_name != 'push' && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Every shard passed
        id: shards
        env:
          SELECTED: ${{ needs.select.result }}
          SPECS: ${{ needs.specs.result }}
          PATHS: ${{ needs.select.outputs.paths }}
        run: |
          [ "$SELECTED" = success ] || { echo "Picking the specs failed; see the select job."; exit 1; }
          if [ -z "$PATHS" ]; then
            echo "No spec applies to this diff (docs, fragments, mockups or e2e specs only)."
            exit 0
          fi
          [ "$SPECS" = success ] || { echo "A spec shard failed; see the specs jobs."; exit 1; }
          echo "ran=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.shards.outputs.ran == 'true'
        with:
          fetch-depth: 0

      - name: Set up Python
        if: steps.shards.outputs.ran == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install coverage and diff-cover
        if: steps.shards.outputs.ran == 'true'
        run: pip install "coverage>=7.6" "diff-cover>=11.0"

      - uses: actions/download-artifact@v4
        if: steps.shards.outputs.ran == 'true'
        with:
          pattern: specs-*
          merge-multiple: true

      - name: Changed lines are at least 98% covered, branches included
        if: steps.shards.outputs.ran == 'true'
        env:
          BASE: ${{ github.event.merge_group.base_sha || github.event.pull_request.base.sha }}
        run: |
          coverage combine
          coverage xml -o coverage.xml --fail-under=0
          diff-cover coverage.xml --compare-branch="$BASE" --branch-coverage --fail-under=98

  # No mutation job: pytest-leela runs no tests for mutants in code that imports Django models, so
  # it reported false survivors, and over four apps it never finished inside 6 hours. Felix removed
  # it on 2026-10-26; #931 tracks a runner that works on Django code.

  # Specs marked postgres_only assert row locks or provoke a real race, which SQLite cannot do,
  # so the spec shards skip them (root conftest.py). This job runs only those, on the
  # PostgreSQL 18 production uses. PLFOG_POSTGRES_ONLY_JOB makes a non-Postgres database an
  # error here instead of a skip, so the job can never pass having run nothing.
  postgres-only:
    if: github.event.action != 'closed' && github.event_name != 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DJANGO_SECRET_KEY: test-secret-key-for-ci
      DATABASE_URL: postgres://plfog:plfog@localhost:5432/plfog
      PLFOG_POSTGRES_ONLY_JOB: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Install and start Postgres 18
        uses: ./.github/actions/postgres

      - name: Run the PostgreSQL only specs
        run: pytest -m postgres_only --no-cov --tb=short

  lint:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CI: true
      DJANGO_SECRET_KEY: test-secret-key-for-ci
      DATABASE_URL: sqlite:///db.sqlite3
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff check
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Mypy
        run: mypy plfog/ core/ membership/ hub/ kiln/ hq/ tours/

      - name: No inline <style> in template extra_head blocks
        run: python scripts/check_no_inline_style_in_extra_head.py
