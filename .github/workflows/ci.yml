name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Every PR adds one file to changelog.d/. That file is the only thing that moves VERSION
  # and the only thing that gets announced, so a PR without one ships a release nobody hears
  # about. This is the check that replaced .github/scripts/release_guard.py: the guard ran on
  # main after Render had already deployed and could not see this mistake at all (it only
  # noticed an edit to plfog/version.py that left the literal alone). Catching it on the
  # branch costs a red X nobody has deployed.
  changelog:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The merge base has to be reachable to tell an added fragment from an existing one.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Every PR ships a changelog fragment
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          # github.sha is the merge commit this job checked out, which is reachable for fork
          # PRs too — the PR head branch itself is not.
          HEAD_SHA: ${{ github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          export TODAY="$(date -u +%F)"
          python .github/scripts/check_changelog_fragment.py

  test:
    runs-on: ubuntu-latest
    env:
      DJANGO_SECRET_KEY: test-secret-key-for-ci
      DATABASE_URL: sqlite:///db.sqlite3
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Django checks
        run: python manage.py check

      - name: Run migrations
        run: python manage.py migrate --run-syncdb

      - name: Run tests
        run: pytest --tb=short

      - name: Run mutation tests
        continue-on-error: true
        run: pytest --leela --target core --target hub --target membership --target plfog

  lint:
    runs-on: ubuntu-latest
    env:
      CI: true
      DJANGO_SECRET_KEY: test-secret-key-for-ci
      DATABASE_URL: sqlite:///db.sqlite3
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff check
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Mypy
        run: mypy plfog/ core/ membership/ hub/

      - name: No inline <style> in template extra_head blocks
        run: python scripts/check_no_inline_style_in_extra_head.py
