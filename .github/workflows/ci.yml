name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, closed]

# One run per pull request: a new push cancels that PR's older run, and closing or merging the
# PR cancels whatever is still going (the `closed` event joins the group, then its jobs skip).
# Pushes to main share one group too, so a burst of merges tests only the newest commit instead
# of holding a runner per merge for hours; a failure there is fixed forward on main anyway.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      DJANGO_SECRET_KEY: test-secret-key-for-ci
      DATABASE_URL: sqlite:///db.sqlite3
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Django checks
        run: python manage.py check

      - name: Run migrations
        run: python manage.py migrate --run-syncdb

      - name: Run tests
        run: pytest --tb=short

      - name: Run mutation tests
        continue-on-error: true
        run: pytest --leela --target core --target hub --target membership --target plfog

  lint:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CI: true
      DJANGO_SECRET_KEY: test-secret-key-for-ci
      DATABASE_URL: sqlite:///db.sqlite3
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff check
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Mypy
        run: mypy plfog/ core/ membership/ hub/

      - name: No inline <style> in template extra_head blocks
        run: python scripts/check_no_inline_style_in_extra_head.py
