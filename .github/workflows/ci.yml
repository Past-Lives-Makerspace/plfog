name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, closed]

# One run per pull request: a new push cancels that PR's older run, and closing or merging the
# PR cancels whatever is still going (the `closed` event joins the group, then its jobs skip).
# Pushes to main share one group too, so a burst of merges tests only the newest commit instead
# of holding a runner per merge for hours; a failure there is fixed forward on main anyway.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      DJANGO_SECRET_KEY: test-secret-key-for-ci
      DATABASE_URL: sqlite:///db.sqlite3
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Django checks
        run: python manage.py check

      - name: Run migrations
        run: python manage.py migrate --run-syncdb

      - name: Run tests
        run: pytest --tb=short


  # Mutation testing is advisory and has its own job and clock. Inside `test` it ran after the
  # suite and pushed the job past its limit, so a passing suite reported as cancelled.
  # pytest-leela re-runs the suite before mutating, so this job takes at least as long as `test`.
  mutation:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    continue-on-error: true
    env:
      DJANGO_SECRET_KEY: test-secret-key-for-ci
      DATABASE_URL: sqlite:///db.sqlite3
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run migrations
        run: python manage.py migrate --run-syncdb

      - name: Run mutation tests
        # pyproject's addopts carry the 98% coverage gate, which a leela run cannot meet (it
        # measures about 26%), so the gate is switched off here: this job reports mutants, not coverage.
        run: pytest --leela --target core --target hub --target membership --target plfog --cov-fail-under=0

  # Specs marked postgres_only assert row locks or provoke a real race, which SQLite cannot do,
  # so `test` and `mutation` skip them (root conftest.py). This job runs only those, on the
  # PostgreSQL 18 production uses. PLFOG_POSTGRES_ONLY_JOB makes a non-Postgres database an
  # error here instead of a skip, so the job can never pass having run nothing.
  postgres-only:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DJANGO_SECRET_KEY: test-secret-key-for-ci
      DATABASE_URL: postgres://plfog:plfog@localhost:5432/plfog
      PLFOG_POSTGRES_ONLY_JOB: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Install and start Postgres 18
        uses: ./.github/actions/postgres

      - name: Run the PostgreSQL only specs
        run: pytest -m postgres_only --no-cov --tb=short

  lint:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CI: true
      DJANGO_SECRET_KEY: test-secret-key-for-ci
      DATABASE_URL: sqlite:///db.sqlite3
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff check
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Mypy
        run: mypy plfog/ core/ membership/ hub/ kiln/ hq/

      - name: No inline <style> in template extra_head blocks
        run: python scripts/check_no_inline_style_in_extra_head.py
