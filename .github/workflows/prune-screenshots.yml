name: Prune screenshots

# Monthly, open a PR that removes PR screenshots older than 30 days from main
# (.github/scripts/prune_screenshots.py says why that is safe). The merge stays a human's call
# like every other PR.
#
# BOT_PAT, not GITHUB_TOKEN: a PR pushed with GITHUB_TOKEN fires no pull_request workflows, so
# the required lint, e2e, fragment and description checks would never report and the PR could
# not merge. PastLivesReviewBot opens it, so it cannot approve it; `no-bot-review` skips the
# review and a human's approval is the gate. Nothing here runs code from a pull request.

on:
  schedule:
    - cron: '0 16 1 * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prune-screenshots
  cancel-in-progress: false

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Each file's age is its last commit, so the whole history has to be here.
          fetch-depth: 0
          token: ${{ secrets.BOT_PAT }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Skip while last month's prune is still open
        id: open
        env:
          GH_TOKEN: ${{ secrets.BOT_PAT }}
        run: |
          open=$(gh pr list --state open --json headRefName \
            --jq '[.[] | select(.headRefName | startswith("ops/prune-screenshots-"))] | length')
          echo "open=$open" >> "$GITHUB_OUTPUT"

      - name: Remove old screenshots
        id: prune
        if: steps.open.outputs.open == '0'
        env:
          PR_BODY_FILE: ${{ runner.temp }}/body.md
        run: python .github/scripts/prune_screenshots.py --days 30 --apply

      - name: Open the PR
        if: steps.open.outputs.open == '0' && steps.prune.outputs.count != '0'
        env:
          GH_TOKEN: ${{ secrets.BOT_PAT }}
        run: |
          branch="ops/prune-screenshots-$(date -u +%Y-%m)"
          git config user.name PastLivesReviewBot
          git config user.email PastLivesReviewBot@users.noreply.github.com
          git switch -c "$branch"
          git add changelog.d
          git commit -m "[ops] Remove PR screenshots older than 30 days"
          git push origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "[ops] Remove PR screenshots older than 30 days" \
            --body-file "$RUNNER_TEMP/body.md" --label no-bot-review
