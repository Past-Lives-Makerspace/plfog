<div id="changelog-modal" class="changelog-overlay" style="display:none;" onclick="if(event.target===this)this.style.display='none'">
    <div class="changelog-modal">
        <div class="changelog-modal__header">
            <h2 class="changelog-modal__title">Changelog</h2>
            <button class="changelog-modal__close" onclick="document.getElementById('changelog-modal').style.display='none'" aria-label="Close changelog">&times;</button>
        </div>
        <div class="changelog-modal__body">
            {% include "includes/_changelog_pages.html" with pages_id="changelog-modal-pages" %}
        </div>
    </div>
</div>
{# A link ending #changelog-<slug> (the "it's live" notice, #693) opens the modal on the page holding that entry. #}
<script>
(function () {
  var hash = window.location.hash;
  if (hash.indexOf("#changelog-") !== 0) return;
  var pages = document.getElementById("changelog-modal-pages");
  var modal = document.getElementById("changelog-modal");
  if (!pages || !modal || !pages.plShowEntry) return;
  var entry = pages.plShowEntry(hash.slice(1));
  if (!entry) return;
  modal.style.display = "flex";
  entry.scrollIntoView({ block: "start" });
})();
</script>
