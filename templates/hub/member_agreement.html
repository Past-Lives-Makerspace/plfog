{% extends "base.html" %}
{% block title %}Member Agreement - Past Lives Makerspace{% endblock %}

{% block content %}
<!-- This is a full page, not a dismissible modal, so it does not use components/modal.html -->
<div class="pl-modal-backdrop">
  <div class="pl-modal" tabindex="-1">
    <div class="pl-modal__header">
      <h2 class="pl-modal__title">One more thing before you head in</h2>
    </div>
    
    <div class="pl-modal__body">
      <p class="u-margin-bottom">Please read and accept the Member Agreement to continue.</p>
      
      <div class="u-margin-bottom" style="border: 1px solid var(--border-color); border-radius: 4px; height: 400px;">
        <iframe src="{{ agreement_url }}" style="width: 100%; height: 100%; border: none;"></iframe>
      </div>
      
      <form method="post" action="{% url 'hub_member_agreement' %}" x-data="{ agreed: false }">
        {% csrf_token %}
        {% if next %}
          <input type="hidden" name="next" value="{{ next }}">
        {% endif %}
        
        <label class="fld fld--checkbox u-margin-bottom">
          <input type="checkbox" name="agree" value="1" x-model="agreed">
          <span>I have read and agree to the Member Agreement.</span>
        </label>
        
        <button type="submit" class="pl-btn pl-btn--primary" style="width: 100%;" x-bind:disabled="!agreed">
          Agree
        </button>
      </form>
      
      <div class="u-text-center u-margin-top">
        <form method="post" action="{% url 'account_logout' %}">
          {% csrf_token %}
          <button type="submit" class="pl-btn pl-btn--quiet">Sign out</button>
        </form>
      </div>
    </div>
  </div>
</div>

<script>
  // Ensure focus is placed inside the card on load for accessibility
  document.addEventListener('DOMContentLoaded', () => {
    document.querySelector('.pl-modal').focus();
  });
</script>
{% endblock %}
