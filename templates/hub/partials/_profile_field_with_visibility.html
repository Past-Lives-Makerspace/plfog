<div class="pl-profile-row">
    <div class="pl-profile-row__head">
        <label for="{{ field.id_for_label }}" class="pl-profile-row__label">{{ label }}</label>
        <button type="button"
                class="pl-vis-toggle"
                data-arm-dirty
                :class="{ 'pl-vis-toggle--on': vis.{{ key }}, 'pl-vis-toggle--off': !vis.{{ key }}, 'pl-vis-toggle--disabled': !listed }"
                :disabled="!listed"
                @click="vis.{{ key }} = !vis.{{ key }}"
                :title="vis.{{ key }} ? 'Visible on your directory card — click to hide' : 'Hidden from your directory card — click to show'">
            <svg x-show="vis.{{ key }}" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg x-show="!vis.{{ key }}" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
            <span x-text="vis.{{ key }} ? 'Public' : 'Hidden'"></span>
        </button>
        <input type="hidden" name="show_{{ key }}" :value="vis.{{ key }} ? 'on' : ''">
    </div>
    <div @input="fields.{{ key }} = $event.target.value" @change="fields.{{ key }} = $event.target.value">
        {{ field }}
    </div>
    {% if field.help_text %}<span class="hub-field-hint">{{ field.help_text }}</span>{% endif %}
    {% for error in field.errors %}<span class="hub-field-error">{{ error }}</span>{% endfor %}
</div>
