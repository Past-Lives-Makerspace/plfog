{# Email Members' header actions (#1142 AC16): New poll opens the composer on Poll, beside New email. Rendered in page_header's action slot. #}
{% url 'hub_compose' as compose_url %}
<span class="pl-btn-row">
  <a href="{{ compose_url }}?kind=poll" class="hub-btn hub-btn--ghost" data-announcements-new-poll>New poll</a>
  <a href="{{ compose_url }}" class="hub-btn hub-btn--primary" data-help-key="announcements.new">New email</a>
</span>
