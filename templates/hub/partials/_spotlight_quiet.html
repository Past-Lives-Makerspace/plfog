{# The Spotlight with no poll and no meeting (spotlight is hub.spotlight.Spotlight): the version pill carrying the newest update's date, which opens the changelog, and Details. #}
{% load hub_tags %}
{% with update=spotlight.latest_update %}
<div class="pl-spotlight__quiet-info">
    <button type="button" class="pl-badge--version" @click="$store.spotlight.showChange('')" {% if update %}title="Updated {{ update.date|changelog_date }}"{% endif %} data-spotlight-quiet-version>v{{ app_version_short }}{% if update %} · {{ update.short_date }}{% endif %}</button>
</div>
<button type="button" class="pl-spotlight__quiet-details" data-spotlight-details @click="$store.spotlight.expand()">Details<svg aria-hidden="true" viewBox="0 0 16 16" width="12" height="12"><path d="M6 3.5 10.5 8 6 12.5" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
{% endwith %}
