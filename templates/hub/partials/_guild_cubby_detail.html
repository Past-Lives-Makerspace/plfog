{# The cubby-detail sheet's body (#977): the tapped cubby's photo, label, place, size, note and price, read from `picked`. #}
<div class="pl-cubby-rent" data-cubby-detail>
  <div class="pl-cubby-rent__top" :class="picked.photo ? '' : 'pl-cubby-rent__top--plain'">
    <div class="pl-cubby-rent__photo" x-show="picked.photo" x-cloak><img :src="picked.photo" :alt="'Photo of cubby ' + picked.label"></div>
    <div>
      <div class="pl-cubby-rent__label"><span x-text="picked.label"></span> <span class="pl-cubby-chip pl-cubby-chip--open"><svg class="pl-cubby-ico" aria-hidden="true"><use href="#i-plus-circle"/></svg>Open</span></div>
      <p class="pl-cubby-rent__where" x-text="picked.where"></p>
      <p class="pl-cubby-rent__size" x-show="picked.size" x-text="picked.size"></p>
      <p class="pl-cubby-rent__note" x-show="picked.note" x-text="picked.note"></p>
    </div>
  </div>
  <p class="pl-cubby-total"><svg class="pl-cubby-ico" aria-hidden="true"><use href="#i-cal"/></svg><span>From <strong x-text="picked.price"></strong> a month, <span x-text="picked.suggested"></span> suggested.</span></p>
  <div class="pl-modal__actions pl-cubby-sheet__actions pl-cubby-detail__actions">
    <button type="button" class="pl-btn pl-btn--secondary" @click="$dispatch('close-modal', 'cubby-detail')">Close</button>
  </div>
</div>
