{% extends "membership/emails/_base.html" %}
{% load rich_text %}
{% block content %}
<p style="margin: 0 0 8px; font-size: 14px; color: #96ACBB;">Hi {{ greeting_name }},</p>
<p style="margin: 0 0 16px; font-size: 12px; color: #EEB44B; text-transform: uppercase; letter-spacing: 0.08em;">Thanks for orienting with <a href="{{ guild_url }}" style="color: #EEB44B;">{{ guild.name }}</a></p>
<div style="font-size: 14px; color: #F4EFDD; line-height: 1.7;">{{ body|rich_email_body }}</div>
{% endblock %}
