{% comment %}
Reusable gold CTA button for the release email.
Params: href — link target (absolute URL); label — button text.
Inline styles are intentional here — email clients strip <style> blocks.
{% endcomment %}
<table role="presentation" cellpadding="0" cellspacing="0" align="center" style="margin: 8px auto 20px;">
<tr>
<td style="border-radius: 6px; background-color: #0d4876;">
    <a href="{{ href }}" style="display: inline-block; padding: 12px 32px; font-size: 15px; font-weight: 700; color: #FFFFFF; text-decoration: none; border-radius: 6px;">{{ label }}</a>
</td>
</tr>
</table>
