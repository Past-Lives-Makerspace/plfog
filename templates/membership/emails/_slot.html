<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin: 8px 0 16px;">
<tr>
<td style="padding: 12px 0; border-top: 1px solid rgba(13, 72, 118, 0.12);">
    {% if orientation_type %}<span style="font-size: 12px; color: #55697a; text-transform: uppercase; letter-spacing: 0.08em;">Orientation</span><br>
    <span style="font-size: 14px; color: #33424f;">{{ orientation_type.name }}</span><br><br>{% endif %}
    <span style="font-size: 12px; color: #55697a; text-transform: uppercase; letter-spacing: 0.08em;">When</span><br>
    <span style="font-size: 14px; color: #33424f;">{{ slot.starts_at|date:"l, F j" }} at {{ slot.starts_at|time:"g:i A" }}</span>
    {% if slot.with_label %}<br><span style="font-size: 13px; color: #55697a;">{{ slot.with_label|capfirst }}</span>{% endif %}
    {% if slot.location %}<br><span style="font-size: 13px; color: #55697a;">{{ slot.location }}</span>{% endif %}
</td>
</tr>
</table>
