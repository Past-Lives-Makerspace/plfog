bump = "minor"
date = "2026-09-29"
title = "Notification settings: your role notices in one place, and switches for a whole channel"
changes = [
  "If you hold a role or an admin permission, the notices it brings you now sit together in Admin / Permissions at the top of Settings → Notifications, grouped by the permission.",
  "New On and Off buttons turn every Email, Push or Discord switch at once, for the whole page, one section or one group. Nothing changes until you press Save.",
  "The Always emailed block is gone. Notices you can't turn off are back in their own topics, with a padlock on their Email switch.",
  "Class review and orientation request emails now follow your Email switch, like every other notice. Turning it off really stops them.",
  "The review row is now called Class review request, to match the email. Admins also get rows for the new class registration email and for payment alerts that need a refund.",
]
