bump = "patch"
date = "2026-09-17"
title = "The announcement composer tells you when you are not allowed to use it"
changes = [
  "Opening the announcement composer without the rights to send one used to drop you on the propose page with no explanation at all. It now tells you why you were moved.",
  "The Preview, Send test email and Send test push buttons used to do nothing at all when you were not allowed to use them. They now say so.",
  "If you are an admin who is previewing the site as a lower role, the message tells you that sending is an admin action and how to get back to it.",
]
