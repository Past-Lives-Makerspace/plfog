bump = "minor"
date = "2026-10-09"
title = "Classes are checked against Eventbrite's rules before they sell there"
changes = [
  "The Eventbrite section of the class editor now shows Eventbrite's rules and a Check for Eventbrite button. It checks what you have typed, saved or not, and lists anything to fix.",
  "The Also sell on Eventbrite switch unlocks once the check passes. Turning it on means you agree to keep the listing within Eventbrite's rules. Edit the class after a check and it asks you to check again.",
  "Saving a class with Eventbrite on is stopped when it asks for payment outside the ticket, lists a fee not included in the price, names a discount code, or has a link, email, phone number or handle in the title. The message quotes the words to fix.",
  "Links, emails, phone numbers, social handles and cancellation or refund questions are listed as left out of Eventbrite, and are removed from the listing on the way out.",
]
