# Internal because no member met this one. The bug shipped at 23:16 UTC and was fixed the
# same evening, on a CMS that is not yet in active use, against demo data. Announcing a
# defect nobody experienced is noise, and the member facing story is already told by
# 371-guild-lead-approval-reuse.toml, which is still accurate.
