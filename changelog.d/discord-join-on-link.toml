changes = [
  "When you connect Discord in Settings, you are now added to the Past Lives Discord server with a role for each of your guilds. Before, connecting only linked your account, so people who had never joined the server stayed off it.",
  "Connecting from the Android app now works. Discord sometimes opens the last step in your phone's browser, and the portal used to refuse it there and ask you to try again.",
  "Already connected but not on the server? Open Settings, press Notifications and press Reconnect Discord.",
]

