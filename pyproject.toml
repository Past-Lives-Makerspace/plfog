[project]
name = "plfog"
version = "0.1.0"
requires-python = ">=3.13"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "plfog.settings"
python_files = ["*_spec.py", "test_*.py"]
python_classes = ["Describe*"]
python_functions = ["it_*", "test_*", "describe_*"]
addopts = "-v --tb=short --cov=. --cov-report=term-missing"

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
extend-select = ["C901"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["C901"]
"**/spec/**" = ["C901"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.mypy]
python_version = "3.13"
plugins = ["mypy_django_plugin.main"]
ignore_missing_imports = true
# Type-check application code only. BDD spec files, the tests/ tree, and
# auto-generated migrations are not type-checked (they're also omitted from
# coverage) — the `disallow_untyped_defs` overrides below otherwise flag every
# nested describe/it function.
exclude = '(^|/)(spec|tests|migrations)/'

[[tool.mypy.overrides]]
module = "membership.*"
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "billing.*"
disallow_untyped_defs = true

[tool.django-stubs]
django_settings_module = "plfog.settings"

[tool.coverage.run]
branch = true
omit = ["*/migrations/*", "*/tests/*", "*/spec/*", "manage.py", "plfog/settings.py", "*/management/commands/airtable_*.py"]

[tool.coverage.report]
fail_under = 98
show_missing = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]
